name: E2E

# スクリーンショット回帰は SwiftShader 固定でも OS 差が残りうるため、
# デプロイの可否とは切り離して走らせる。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # このランナーで WebGPU が使えるかを yes / no で答える。
  #
  # Phase 8 は基準画像を WebGPU で撮り直す。**ここが no なら E2E が丸ごと
  # 止まる**ので、移行に着手する前に答えを出しておく。落ちても後続は止めない。
  # 知ることが目的で、通すことが目的ではない。
  webgpu-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      available: ${{ steps.probe.outputs.available }}
      timestamp_query: ${{ steps.probe.outputs.timestamp_query }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8

      - id: probe
        run: node tools/webgpu-probe.mjs
        continue-on-error: true

  # 歯型。わざと壊して、落ちるべき検査が落ちることを確かめる。
  #
  # **テストが通ることと、テストが守っていることは別。**実測 14 件で 44 秒。
  # ブラウザも apt も要らない node だけの仕事なので、E2E とは分けて速く回す。
  # `deploy.yml` の `npm test` は main への push でしか走らないので、
  # PR でも回るこちらに置く。
  bite-marks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 表が現在のソースと噛み合っているか。18 秒で分かる
      - run: npx vitest run tests/tools/mutate.test.ts

      # 実際に当てる。1 件でも生存したら赤
      - run: npm run mutate

  playwright:
    runs-on: ubuntu-latest
    # 基準画像 42 枚を SwiftShader で撮る。ランナーは 4 vCPU しかないので
    # 1 台では 2 ワーカーが上限。台数を増やすほうが効く。
    #
    # **`--shard` はテストの本数で割る。**所要は 1 件 8 秒から 45 秒まで
    # 開きがあるので、重いものが 1 台へ寄る。並びはファイル順・行順なので、
    # ライブ UI（`openLive` で全部読み込む）が固まっている末尾が重くなる。
    #
    # | 分割 | 最短 | 最長 |
    # |---|---|---|
    # | 2 分割（33378420162） | 14.9 分 | **25.7 分（上限に当たった）** |
    # | 4 分割（33397654209） | 4.2 分 | 17.4 分 |
    #
    # 4 分割でも最長は 17.4 分で、18 分の上限に対して余裕 1.03 倍しかない。
    #
    # **遅さの正体は競合。**ページ読み込みそのものは実測 3.4 秒（`preset=low`
    # なら 2.4 秒）で、テストの中身も 1.5 秒の待ちが 2 回程度。SwiftShader は
    # CPU 律速なので、ワーカーが同時に描くと 1 件が 20 秒から 45 秒へ伸びる。
    #
    # 8 分割にして重い塊を 2 台へ割る。**釣り合わせてはいない。薄めている。**
    # 根本を直すには所要を見た分配が要る。`docs/lessons.md` に穴として残す。
    #
    # ジョブの上限はブラウザ取得（キャッシュを外すと 8 分）を含むので
    # 段の上限より外側に置く。
    timeout-minutes: 30
    strategy:
      # 1 台落ちても残りを走らせて、どこまで通ったかを見る
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # apt は使わない。
      #
      # `playwright install-deps` の中身は apt で、3 回詰まった。
      #
      # run 32218635136（--with-deps）は 15 分以上かかってジョブの上限に当たり、
      # run 32234323647 は InRelease を取った 08:48:18 のあと 09:22:40 まで
      # 34 分間 1 行も出力せず cancelled、run 32245880550 の shard 1 は
      # azure.archive.ubuntu.com からの `fonts-freefont-ttf` に 3 分 45 秒、
      # 次の 1 本に 5 分 21 秒かかって 10 分の上限に当たった。
      #
      # 最初は `Acquire::http::Timeout` を入れて直そうとしたが効かない。
      # **細くデータが流れ続けるので無通信のタイムアウトは発火しない。**
      # 遅い mirror はタイムアウトでは直せない。
      #
      # やり直しの段も無駄だった。上限で殺した apt が dpkg を掴んだままなので、
      # 2 回目は 6 秒で exit 100 になる。
      #
      # そもそも要らない。ubuntu-latest のイメージは Chrome と Edge を同梱して
      # いるので Chromium が動く共有ライブラリは揃っている。install-deps が
      # 追加で引くのは主にフォントで、このリポジトリが撮るのは canvas だけ。
      # 足りなければ Chromium の起動が即座に失敗するので、黙って壊れはしない。
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8

      # **上限はテスト数に合わせて見直す。**Phase 4 の 58 件では 5 分前後
      # だったので 15 分にしていたが、Phase 5 で 116 件へ倍増して
      # 15 分 33 秒に当たった（run 32483238054 の shard 1）。テスト自体は
      # 落ちておらず、上限だけが原因。25 分にして 1.7 倍の余裕を取った。
      #
      # **その 25 分にも当たった**（run 33378420162 の shard 2、25.7 分）。
      # 2 分割のまま所要が 16.7 → 24.0 → 25.7 と育っていた。通り続けて
      # いたので、余裕が減っていることが見えなかった。**上限は当たるまで
      # 何も言わない。**
      #
      # 4 分割では最長 17.4 分で、18 分に対して余裕 1.03 倍しかなかった。
      # 8 分割にして重い塊を 2 台へ割る。見込みは 9 分前後で余裕 2 倍。
      # **当たったら分割を増やす。上限を上げるのは、所要が増えてよい理由が
      # あるときだけ。**
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        timeout-minutes: 18

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
