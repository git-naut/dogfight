name: E2E

# スクリーンショット回帰は SwiftShader 固定でも OS 差が残りうるため、
# デプロイの可否とは切り離して走らせる。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    # 56 枚の基準画像を SwiftShader で撮る。ランナーは 4 vCPU しかないので
    # 1 台では 2 ワーカーが上限で、実測 9 分 50 秒（直列は 14 分 33 秒）。
    # 台数を増やすほうが効く。分割して 2 台で分担する。
    #
    # 段ごとに上限を付けたので、最悪でも 10 + 10 + 8 + 15 で収まる。
    timeout-minutes: 45
    strategy:
      # 1 台落ちても残りを走らせて、どこまで通ったかを見る
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # apt にタイムアウトを設定する。
      #
      # 既定では取得の読み取りに上限がないので、mirror が黙ると無限に待つ。
      # 実際に 2 回踏んだ（run 32218635136 と 32234323647）。後者のログでは
      # azure.archive.ubuntu.com が Ign を返して archive.ubuntu.com へ倒れ、
      # InRelease を 3 本取った 08:48:18 のあと 09:22:40 まで 34 分間、
      # 1 行も出力せずジョブの制限に当たって cancelled になった。
      - name: apt に取得のタイムアウトを入れる
        run: |
          sudo tee /etc/apt/apt.conf.d/99-timeout >/dev/null <<'CONF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          Acquire::Retries "3";
          CONF

      # ブラウザ本体はキャッシュする。apt のほうは毎回入れる必要があるので
      # --with-deps をやめて 2 段に分ける。
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 詰まったら段だけ捨てて、もう一度引く。ジョブごと打ち切られるのを避ける。
      - name: ブラウザの依存を入れる
        id: deps
        continue-on-error: true
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      - name: ブラウザの依存を入れる（やり直し）
        if: steps.deps.outcome == 'failure'
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      - run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8

      # 5 分前後で終わる想定。15 分に当たったら固まっている。
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        timeout-minutes: 15

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
